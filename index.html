<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="바둑">
<meta name="theme-color" content="#f4efe6">
<title>바둑 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6;
    --panel: #ffffff;
    --text: #2b2118;
    --muted: #7a6a58;
    --accent: #8b5a2b;
    --accent-text: #ffffff;
    --border: #e2d6c3;
    --good: #2e8b57;
    --warn: #c0392b;
    --tip-bg: #fff6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1915;
      --panel: #2a241e;
      --text: #f1e8dc;
      --muted: #b3a48f;
      --accent: #d29a5c;
      --accent-text: #1d1915;
      --border: #463b2f;
      --good: #5cc98a;
      --warn: #ff7b6b;
      --tip-bg: #3a3222;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    margin: 0;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .wrap {
    margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  header { text-align: center; margin-bottom: 10px; }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.15em; }

  /* 세로 화면: 바둑판 위, 메뉴 아래 */
  .layout { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .board-box { width: 100%; display: flex; justify-content: center; }
  canvas {
    display: block;
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    touch-action: none;
    cursor: pointer;
  }
  .side { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
  .side > .tabs, .side > .side-title { grid-column: 1 / -1; }
  #lessonPanel { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #gamePanel { display: contents; }

  /* 가로 화면 (아이패드 가로 등): 바둑판 왼쪽, 메뉴 오른쪽 */
  @media (orientation: landscape) and (min-width: 900px) {
    header { display: none; }
    .layout { flex-direction: row; align-items: flex-start; justify-content: center; gap: 20px; }
    .board-box { width: auto; flex: 1 1 auto; min-width: 0; }
    .side {
      flex: 0 0 360px; display: flex; flex-direction: column;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    #lessonPanel { display: flex; flex-direction: column; }
    .side-title { display: block !important; }
  }
  .side-title { display: none; margin: 0; font-size: 1.6rem; letter-spacing: 0.15em; text-align: center; }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px;
  }
  .card h2 { margin: 0 0 8px; font-size: 1rem; color: var(--muted); font-weight: 700; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button { flex: 1; }
  .seg:last-child { margin-bottom: 0; }
  button {
    font-family: inherit; font-size: 1.05rem; font-weight: 700;
    padding: 10px 8px; border-radius: 12px; min-height: 54px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    cursor: pointer;
  }
  @media (hover: hover) { button:hover:not(:disabled) { border-color: var(--accent); } }
  button:active:not(:disabled) { transform: scale(0.97); }
  button.on, button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.hint { background: #ffcf3f; color: #3b2a00; border-color: #e0b020; }
  button:disabled { opacity: 0.45; cursor: default; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btns .full { grid-column: 1 / -1; }
  .small-btns button { font-size: 0.9rem; min-height: 46px; }

  .tabs { display: flex; gap: 8px; }
  .tabs button { flex: 1; font-size: 1.15rem; min-height: 56px; }

  .turn { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 700; }
  .stone-icon { width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; }
  .stone-icon.b { background: radial-gradient(circle at 35% 35%, #666, #000); }
  .stone-icon.w { background: radial-gradient(circle at 35% 35%, #fff, #c8c8c8); border: 1px solid #999; }
  .goal { margin-top: 6px; color: var(--muted); font-weight: 700; }
  .caps { display: flex; gap: 10px; margin-top: 10px; }
  .cap { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px; background: var(--bg); }
  .cap .stone-icon { width: 20px; height: 20px; }
  .cap span { font-size: 0.95rem; }
  .msg {
    min-height: 1.5em; margin-top: 10px; font-weight: 700; line-height: 1.5;
    white-space: pre-line;
  }
  .msg:not(:empty) { background: var(--tip-bg); padding: 8px 10px; border-radius: 10px; }

  .lesson-ch { color: var(--accent); font-weight: 700; font-size: 0.95rem; }
  .lesson-title { margin: 4px 0 8px; font-size: 1.35rem; }
  .lesson-text { font-size: 1.1rem; line-height: 1.6; margin: 0; white-space: pre-line; }
  .lesson-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .lesson-grid button { min-height: 46px; font-size: 1rem; padding: 4px; }
  .lesson-grid button.solved { border-color: var(--good); color: var(--good); }
  .lesson-grid button.solved.on { color: var(--accent-text); }
  .lv-tabs button { font-size: 0.95rem; line-height: 1.25; padding: 6px 4px; }
  .lv-tabs small { display: block; font-size: 0.75rem; font-weight: 400; opacity: 0.85; }

  .help { font-size: 0.95rem; color: var(--muted); line-height: 1.6; }
  .help ul { margin: 0; padding-left: 18px; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--panel); color: var(--text); border-radius: 18px; padding: 22px;
    width: 100%; max-width: 420px; text-align: center; max-height: 92vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 12px; font-size: 1.6rem; }
  .modal table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 1rem; }
  .modal th, .modal td { padding: 6px; border-bottom: 1px solid var(--border); }
  .modal td:first-child { text-align: left; color: var(--muted); }
  .modal .modal-btns { display: flex; gap: 8px; margin-top: 8px; }
  .modal .modal-btns button { flex: 1; }
  .setup { text-align: left; }
  .setup h2 { font-size: 1rem; color: var(--muted); margin: 12px 0 6px; }
  .setup .desc { font-size: 0.92rem; color: var(--muted); margin: -4px 0 4px; min-height: 1.4em; }
  .big-emoji { font-size: 3rem; line-height: 1; margin-bottom: 6px; }

  @media (max-width: 600px) {
    .side, #lessonPanel { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>바둑</h1></header>

  <div class="layout">
    <div class="board-box">
      <canvas id="board"></canvas>
    </div>

    <div class="side" id="side">
      <h1 class="side-title">바둑</h1>
      <div class="tabs">
        <button id="tabGame" class="on">🎮 대국하기</button>
        <button id="tabLesson">📖 배우기</button>
      </div>

      <!-- 대국 화면 -->
      <div id="gamePanel">
        <div class="card">
          <div class="turn" id="turn"><div class="stone-icon b"></div><span>흑 차례</span></div>
          <div class="goal" id="goal"></div>
          <div class="caps">
            <div class="cap"><div class="stone-icon b"></div><span>흑이 잡은 돌 <b id="capB">0</b></span></div>
            <div class="cap"><div class="stone-icon w"></div><span>백이 잡은 돌 <b id="capW">0</b></span></div>
          </div>
          <div class="msg" id="msg"></div>
        </div>

        <div class="card" id="playBtns">
          <div class="btns">
            <button id="hintBtn" class="hint full">💡 힌트 보기</button>
            <button id="undoBtn">↩ 무르기</button>
            <button id="passBtn">한 수 쉼</button>
            <button id="newBtn" class="primary">새 대국</button>
            <button id="resignBtn">기권</button>
          </div>
        </div>

        <div class="card" id="scoreBtns" style="display:none">
          <h2>집 세기</h2>
          <p class="help" style="margin-top:0">죽은 돌을 눌러 표시하세요. 다시 누르면 취소돼요.</p>
          <div class="btns">
            <button id="countBtn" class="primary full">계산하기</button>
            <button id="resumeBtn" class="full">대국 계속하기</button>
          </div>
        </div>

        <div class="card">
          <h2>설정</h2>
          <div class="seg small-btns">
            <button id="helperBtn">도우미</button>
            <button id="confirmBtn">두 번 눌러 두기</button>
          </div>
          <div class="seg small-btns">
            <button id="soundBtn">소리</button>
            <button id="vibeBtn">진동</button>
          </div>
        </div>
      </div>

      <!-- 배우기 화면 -->
      <div id="lessonPanel" style="display:none">
        <div class="card">
          <div class="lesson-ch" id="lessonCh"></div>
          <h3 class="lesson-title" id="lessonTitle"></h3>
          <p class="lesson-text" id="lessonText"></p>
          <div class="msg" id="lessonMsg"></div>
        </div>
        <div class="card">
          <div class="btns" style="margin-bottom:10px">
            <button id="lessonHint" class="hint full">💡 힌트</button>
            <button id="lessonPrev">◀ 이전</button>
            <button id="lessonNext" class="primary">다음 ▶</button>
            <button id="lessonRetry" class="full">↺ 다시 하기</button>
          </div>
          <h2>문제 고르기</h2>
          <div class="seg lv-tabs" id="lvTabs"></div>
          <div class="lesson-grid" id="lessonGrid"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 결과 창 -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="big-emoji" id="resultEmoji"></div>
    <h3 id="resultTitle"></h3>
    <div id="resultBody"></div>
    <div class="modal-btns">
      <button id="closeModal">닫기</button>
      <button id="modalNew" class="primary">새 대국</button>
    </div>
  </div>
</div>

<!-- 새 대국 설정 창 -->
<div class="modal-bg" id="setupBg">
  <div class="modal setup">
    <h3 style="text-align:center">새 대국</h3>
    <h2>게임 방법</h2>
    <div class="seg" id="ruleSeg">
      <button data-v="capture">🎯 따먹기</button>
      <button data-v="territory">🏠 집 짓기</button>
    </div>
    <p class="desc" id="ruleDesc"></p>
    <div id="targetBox">
      <h2>몇 개를 먼저 잡으면 이길까요?</h2>
      <div class="seg" id="targetSeg">
        <button data-v="1">1개</button>
        <button data-v="3">3개</button>
        <button data-v="5">5개</button>
      </div>
    </div>
    <h2>바둑판 크기</h2>
    <div class="seg" id="sizeSeg">
      <button data-v="9">9줄</button>
      <button data-v="13">13줄</button>
      <button data-v="19">19줄</button>
    </div>
    <h2>누구와 둘까요?</h2>
    <div class="seg" id="modeSeg">
      <button data-v="cpu">🤖 컴퓨터와</button>
      <button data-v="pvp">👫 친구와</button>
    </div>
    <div id="levelBox">
      <h2>컴퓨터 단계</h2>
      <div class="seg" id="levelSeg">
        <button data-v="1">🌱 1</button>
        <button data-v="2">🌿 2</button>
        <button data-v="3">🌳 3</button>
        <button data-v="4">⛰️ 4</button>
      </div>
      <p class="desc" id="levelDesc"></p>
    </div>
    <div class="modal-btns">
      <button id="setupCancel">취소</button>
      <button id="setupStart" class="primary">시작!</button>
    </div>
  </div>
</div>

<script>
const EMPTY = 0, BLACK = 1, WHITE = 2;
const KOMI = 6.5;
const other = c => 3 - c;
const NAME = { 1: '흑', 2: '백' };
const $ = id => document.getElementById(id);

const LEVELS = {
  1: { name: '🌱 1단계 새싹', desc: '처음 배우는 친구에게 딱 좋아요.', noise: 4, blunder: 0.55, look: false },
  2: { name: '🌿 2단계 새잎', desc: '돌을 잡을 줄 알지만 실수도 많이 해요.', noise: 2, blunder: 0.2, look: false },
  3: { name: '🌳 3단계 나무', desc: '잡고, 도망가고, 제법 잘 둬요.', noise: 0.8, blunder: 0, look: false },
  4: { name: '⛰️ 4단계 산', desc: '상대의 다음 수까지 생각해요. 어려워요!', noise: 0.4, blunder: 0, look: true },
};
const RULE_DESC = {
  capture: '상대 돌을 정해진 개수만큼 먼저 잡으면 이겨요. 처음 배울 때 좋아요!',
  territory: '진짜 바둑이에요. 집(내 돌로 둘러싼 빈 곳)이 많은 쪽이 이겨요.',
};

// ---------- 설정 (기기에 기억) ----------
const settings = {
  sound: true, vibe: true, helper: true,
  confirm: matchMedia('(pointer: coarse)').matches,
  rule: 'capture', target: 3, size: 9, mode: 'cpu', level: 1,
};
try { Object.assign(settings, JSON.parse(localStorage.getItem('baduk-settings') || '{}')); } catch (e) {}
// 저장된 값이 잘못되어 있으면 기본값으로
if (!LEVELS[settings.level]) settings.level = 1;
if (![9, 13, 19].includes(settings.size)) settings.size = 9;
if (![1, 3, 5].includes(settings.target)) settings.target = 3;
if (!RULE_DESC[settings.rule]) settings.rule = 'capture';
if (!['cpu', 'pvp'].includes(settings.mode)) settings.mode = 'cpu';
function saveSettings() { try { localStorage.setItem('baduk-settings', JSON.stringify(settings)); } catch (e) {} }

let solvedLessons = new Set();
try { solvedLessons = new Set(JSON.parse(localStorage.getItem('baduk-lessons') || '[]')); } catch (e) {}
function saveLessons() { try { localStorage.setItem('baduk-lessons', JSON.stringify([...solvedLessons])); } catch (e) {} }

// ---------- 상태 ----------
let N = 9, NB = [];
let board, turn, caps, ko, history, last, passes, phase, dead;
let game = { rule: 'capture', target: 3, mode: 'cpu', level: 1 }; // 진행 중인 대국의 규칙
const cpuColor = WHITE;
let cpuTimer = null;
let hover = -1;
let pending = -1;   // '두 번 눌러 두기'에서 첫 번째로 누른 자리
let hintPt = -1;    // 힌트로 보여 주는 자리
let view = 'game';  // 'game' | 'lesson'
let savedGame = null;
let resigned = false; // 기권으로 끝난 대국인지 (무르기 때 구분)

const canvas = $('board');
const ctx = canvas.getContext('2d');

// ---------- 규칙 ----------
function buildNeighbors() {
  NB = [];
  for (let i = 0; i < N * N; i++) {
    const x = i % N, y = (i / N) | 0, r = [];
    if (x > 0) r.push(i - 1);
    if (x < N - 1) r.push(i + 1);
    if (y > 0) r.push(i - N);
    if (y < N - 1) r.push(i + N);
    NB.push(r);
  }
}

function group(b, i) {
  const c = b[i], stones = [i], libs = new Set(), seen = new Uint8Array(N * N);
  seen[i] = 1;
  for (let k = 0; k < stones.length; k++) {
    for (const n of NB[stones[k]]) {
      if (b[n] === EMPTY) libs.add(n);
      else if (b[n] === c && !seen[n]) { seen[n] = 1; stones.push(n); }
    }
  }
  return { stones, libs };
}

// 착수 시도: 불가능하면 { error } 반환
function tryPlay(b, i, c, koPt) {
  if (b[i] !== EMPTY) return { error: 'occupied' };
  if (i === koPt) return { error: 'ko' };
  const nb = b.slice();
  nb[i] = c;
  const captured = [];
  for (const n of NB[i]) {
    if (nb[n] === other(c)) {
      const g = group(nb, n);
      if (g.libs.size === 0) for (const s of g.stones) { nb[s] = EMPTY; captured.push(s); }
    }
  }
  const g = group(nb, i);
  if (g.libs.size === 0) return { error: 'suicide' };
  const newKo = (captured.length === 1 && g.stones.length === 1 && g.libs.size === 1) ? captured[0] : -1;
  return { b: nb, captured, ko: newKo, libs: g.libs.size, size: g.stones.length, group: g };
}

// 단수(숨구멍 1개)에 걸린 돌 묶음 찾기
function ataris(b, color) {
  const seen = new Uint8Array(N * N), res = [];
  for (let i = 0; i < N * N; i++) {
    if (b[i] !== color || seen[i]) continue;
    const g = group(b, i);
    g.stones.forEach(s => seen[s] = 1);
    if (g.libs.size === 1) res.push(g);
  }
  return res;
}

// ---------- 대국 진행 ----------
function newGame() {
  clearTimeout(cpuTimer);
  game = { rule: settings.rule, target: settings.target, mode: settings.mode, level: settings.level };
  N = settings.size;
  buildNeighbors();
  board = new Int8Array(N * N);
  turn = BLACK;
  caps = { 1: 0, 2: 0 };
  ko = -1;
  history = [];
  last = -1;
  passes = 0;
  phase = 'play';
  dead = new Set();
  resigned = false;
  hover = pending = hintPt = -1;
  const who = game.mode === 'cpu' ? `${LEVELS[game.level].name} 컴퓨터와 대국해요.` : '친구와 번갈아 둬요.';
  setMsg(`${who}\n흑이 먼저 둬요!`);
  closeModal();
  resize();
  updateUI();
}

function snapshot() {
  history.push({ board: board.slice(), turn, caps: { ...caps }, ko, last, passes });
}

function restore(s) {
  board = s.board; turn = s.turn; caps = s.caps; ko = s.ko; last = s.last; passes = s.passes;
}

const isHuman = c => game.mode === 'pvp' || c !== cpuColor;

function placeStone(i) {
  const r = tryPlay(board, i, turn, ko);
  if (r.error) {
    if (r.error === 'ko') setMsg('여기는 "패"예요.\n바로 다시 잡을 수 없어요. 다른 곳에 한 번 두고 와요.');
    else if (r.error === 'suicide') setMsg('여기는 숨구멍이 하나도 없어서 둘 수 없어요.');
    sfxWrong();
    return false;
  }
  snapshot();
  const mover = turn;
  board = r.b;
  caps[mover] += r.captured.length;
  ko = r.ko;
  last = i;
  passes = 0;
  turn = other(mover);
  playSound(r.captured.length);

  let m = '';
  if (r.captured.length) {
    m = isHuman(mover)
      ? `와! ${NAME[mover]}이 돌 ${r.captured.length}개를 잡았어요 🎉`
      : `앗! 컴퓨터가 돌 ${r.captured.length}개를 잡았어요.`;
  }
  if (game.rule === 'capture' && caps[mover] >= game.target) {
    setMsg(m);
    endCaptureGame(mover);
    return true;
  }
  setMsg([m, helperTip()].filter(Boolean).join('\n'));
  afterMove();
  return true;
}

// 배움 도우미: 지금 둘 사람에게 단수 상황을 알려 줌
function helperTip() {
  if (!settings.helper || !isHuman(turn)) return '';
  const mine = ataris(board, turn), theirs = ataris(board, other(turn));
  if (mine.length) return `⚠️ 조심! ${NAME[turn]} 돌이 단수예요 (숨구멍 1개).\n도망가거나, 상대 돌을 먼저 잡아요.`;
  if (theirs.length) return `✨ 기회! 잡을 수 있는 ${NAME[other(turn)]} 돌이 있어요. 빨간 동그라미를 찾아봐요.`;
  return '';
}

function pass() {
  snapshot();
  passes++;
  ko = -1;
  last = -1;
  setMsg(`${isHuman(turn) ? NAME[turn] + '이' : '컴퓨터가'} 한 수 쉬었어요.`);
  turn = other(turn);
  if (passes >= 2) {
    if (game.rule === 'capture') { endCaptureByPass(); return; }
    startScoring();
    return;
  }
  afterMove();
}

function afterMove() {
  pending = -1;
  hintPt = -1;
  updateUI();
  draw();
  if (game.mode === 'cpu' && phase === 'play' && turn === cpuColor) {
    cpuTimer = setTimeout(cpuMove, 500);
  }
}

function undo() {
  clearTimeout(cpuTimer);
  pending = hintPt = -1;
  if (resigned) {
    // 기권만 취소하고 둔 수는 그대로
    resigned = false;
    phase = 'play';
    closeModal();
    setMsg('기권을 취소했어요. 계속 둬요!');
    afterMove();
    return;
  }
  if (!history.length) return;
  restore(history.pop());
  while (game.mode === 'cpu' && turn === cpuColor && history.length) restore(history.pop());
  phase = 'play';
  dead.clear();
  closeModal();
  setMsg('한 수 물렀어요. 다시 생각해 봐요!');
  updateUI();
  draw();
}

function resign() {
  if (phase !== 'play') return;
  const loser = game.mode === 'cpu' ? BLACK : turn;
  if (!confirm(`${NAME[loser]}이 기권할까요?`)) return;
  clearTimeout(cpuTimer);
  phase = 'over';
  resigned = true;
  updateUI();
  draw();
  showModal('🏳️', `${NAME[other(loser)]} 승리`, `<p>${NAME[loser]}이 기권했어요.</p>`);
}

function winTitle(c) {
  if (game.mode === 'cpu') return c === BLACK ? ['🎉', '내가 이겼어요!'] : ['💪', '컴퓨터가 이겼어요'];
  return ['🎉', `${NAME[c]} 승리!`];
}

function endCaptureGame(winner) {
  clearTimeout(cpuTimer);
  phase = 'over';
  updateUI();
  draw();
  const [emoji, title] = winTitle(winner);
  let body = `<p>${NAME[winner]}이 돌 ${game.target}개를 먼저 잡았어요.</p>`;
  if (game.mode === 'cpu' && winner === BLACK) {
    body += game.level < 4
      ? `<p>잘했어요! 다음에는 <b>${LEVELS[game.level + 1].name}</b>에 도전해 볼까요?</p>`
      : '<p>가장 어려운 단계를 이겼어요! 이제 🏠 집 짓기 바둑에도 도전해 봐요.</p>';
  } else if (game.mode === 'cpu') {
    body += '<p>괜찮아요! "무르기"로 돌아가서 다시 해 보거나, 💡 힌트를 써 봐요.</p>';
  }
  sfx(winner === BLACK || game.mode === 'pvp' ? 'win' : 'lose');
  showModal(emoji, title, body);
}

function endCaptureByPass() {
  phase = 'over';
  updateUI();
  draw();
  if (caps[1] === caps[2]) {
    showModal('🤝', '비겼어요', `<p>두 사람 모두 쉬었어요. 잡은 돌이 ${caps[1]}개로 같아요.</p>`);
    return;
  }
  const w = caps[1] > caps[2] ? BLACK : WHITE;
  const [emoji, title] = winTitle(w);
  showModal(emoji, title, `<p>두 사람 모두 쉬었어요. 돌을 더 많이 잡은 ${NAME[w]}이 이겼어요.</p>`);
}

// ---------- 계가 (집 짓기 바둑) ----------
function startScoring() {
  clearTimeout(cpuTimer);
  phase = 'score';
  dead = new Set();
  setMsg('두 사람 모두 쉬었어요.\n살 수 없는 돌(죽은 돌)이 있으면 눌러서 표시해요.');
  updateUI();
  draw();
}

function toggleDead(i) {
  if (board[i] === EMPTY) return;
  const g = group(board, i);
  const isDead = dead.has(i);
  for (const s of g.stones) isDead ? dead.delete(s) : dead.add(s);
  draw();
}

function evaluate() {
  const b = board.slice();
  let deadB = 0, deadW = 0;
  for (const i of dead) {
    if (b[i] === BLACK) deadB++;
    else if (b[i] === WHITE) deadW++;
    b[i] = EMPTY;
  }
  const owner = new Int8Array(N * N);
  const seen = new Uint8Array(N * N);
  const terr = { 1: 0, 2: 0 };
  for (let i = 0; i < N * N; i++) {
    if (b[i] !== EMPTY || seen[i]) continue;
    const region = [i], border = new Set();
    seen[i] = 1;
    for (let k = 0; k < region.length; k++) {
      for (const n of NB[region[k]]) {
        if (b[n] === EMPTY) { if (!seen[n]) { seen[n] = 1; region.push(n); } }
        else border.add(b[n]);
      }
    }
    if (border.size === 1) {
      const c = [...border][0];
      for (const p of region) owner[p] = c;
      terr[c] += region.length;
    }
  }
  const black = terr[1] + caps[1] + deadW;
  const white = terr[2] + caps[2] + deadB + KOMI;
  return { owner, terr, deadB, deadW, black, white };
}

function finishCount() {
  const e = evaluate();
  phase = 'over';
  updateUI();
  draw();
  const diff = Math.abs(e.black - e.white);
  const w = e.black > e.white ? BLACK : WHITE;
  const [emoji, title] = winTitle(w);
  sfx(w === BLACK || game.mode === 'pvp' ? 'win' : 'lose');
  showModal(emoji, title, `<p>${NAME[w]}이 ${diff}집 더 많아요.</p>
    <table>
      <tr><th></th><th>흑</th><th>백</th></tr>
      <tr><td>집</td><td>${e.terr[1]}</td><td>${e.terr[2]}</td></tr>
      <tr><td>잡은 돌</td><td>${caps[1]}</td><td>${caps[2]}</td></tr>
      <tr><td>죽은 돌</td><td>${e.deadW}</td><td>${e.deadB}</td></tr>
      <tr><td>덤 (백이 뒤에 둬서 받는 점수)</td><td>-</td><td>${KOMI}</td></tr>
      <tr><th>합계</th><th>${e.black}</th><th>${e.white}</th></tr>
    </table>`);
}

function resumePlay() {
  phase = 'play';
  passes = 0;
  dead.clear();
  setMsg('대국을 계속해요.');
  afterMove();
}

// ---------- 컴퓨터 / 힌트 ----------
function isOwnEye(b, i, c) {
  for (const n of NB[i]) if (b[n] !== c) return false;
  const x = i % N, y = (i / N) | 0;
  let bad = 0, offBoard = 0;
  for (const [dx, dy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) { offBoard++; continue; }
    if (b[ny * N + nx] === other(c)) bad++;
  }
  return offBoard > 0 ? bad === 0 : bad <= 1;
}

// 한 자리의 점수와 그 이유를 계산 (둘 수 없으면 null)
function scoreMove(b, i, c, koPt, stoneCount) {
  if (b[i] !== EMPTY || isOwnEye(b, i, c)) return null;
  const r = tryPlay(b, i, c, koPt);
  if (r.error) return null;
  const opp = other(c);
  const cap = game.rule === 'capture';
  let s = 0, reason = 'good', top = 0;
  const add = (v, why) => { s += v; if (v > top) { top = v; reason = why; } };

  // 따내기
  if (r.captured.length) add(r.captured.length * 6 + (cap ? 8 : 0), 'capture');

  // 단수에 걸린 내 돌 살리기
  const seenOwn = new Set();
  for (const n of NB[i]) {
    if (b[n] !== c || seenOwn.has(n)) continue;
    const g = group(b, n);
    g.stones.forEach(t => seenOwn.add(t));
    if (g.libs.size === 1 && r.libs >= 2) add(5 + g.stones.length * 3 + (cap ? 6 : 0), 'save');
  }

  // 스스로 단수 되는 자리 피하기
  if (r.libs === 1 && r.captured.length === 0) s -= (4 + r.size * 3) * (cap ? 2 : 1);
  else if (r.libs === 2) s -= cap ? 1 : 0.5;

  // 상대 돌 공격
  const seenOpp = new Set();
  for (const n of NB[i]) {
    if (r.b[n] !== opp || seenOpp.has(n)) continue;
    const g = group(r.b, n);
    g.stones.forEach(t => seenOpp.add(t));
    if (g.libs.size === 1) add(3 + g.stones.length * 2 + (cap ? 3 : 0), 'atari');
    else if (g.libs.size === 2) s += 0.8;
  }

  // 위치 점수
  const x = i % N, y = (i / N) | 0;
  const d = Math.min(x, y, N - 1 - x, N - 1 - y);
  const early = stoneCount < N * N * 0.15;
  if (d === 0) s -= 2;
  else if (d === 1) s -= early ? 1 : 0.3;
  else if (d === 2 || d === 3) s += early ? 1.5 : 0.3;

  // 근처에 돌이 있으면 가산
  let near = 0;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    if (Math.abs(dx) + Math.abs(dy) > 2) continue;
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < N && ny < N && b[ny * N + nx]) near++;
  }
  if (near > 0) s += 0.6;
  else if (stoneCount > 4) s -= 0.3;

  return { s, reason, r };
}

function chooseMove(c, lv) {
  let stoneCount = 0;
  for (let i = 0; i < N * N; i++) if (board[i]) stoneCount++;
  const cands = [];
  let bestS = -Infinity; // 실수와 상관없는 진짜 최고 점수 (쉴지 말지 정할 때 씀)
  for (let i = 0; i < N * N; i++) {
    const m = scoreMove(board, i, c, ko, stoneCount);
    if (!m) continue;
    if (m.s > bestS) bestS = m.s;
    // 실수: 낮은 단계에서는 가끔 아무 데나 둠 (단, 스스로 단수되는 수는 덜 둠)
    let v = Math.random() < lv.blunder ? Math.min(m.s, 0) * 0.3 + Math.random() * 3 : m.s;
    v += Math.random() * lv.noise;
    cands.push({ i, v, m });
  }
  if (!cands.length) return null;
  cands.sort((a, b) => b.v - a.v);
  if (lv.look) {
    // 상대가 가장 좋은 수로 받았을 때를 생각해서 점수를 조정
    for (const cd of cands.slice(0, 6)) {
      let worst = 0;
      const save = board;
      board = cd.m.r.b;
      for (let j = 0; j < N * N; j++) {
        const o = scoreMove(board, j, other(c), cd.m.r.ko, stoneCount + 1);
        if (o && o.s > worst) worst = o.s;
      }
      board = save;
      cd.v -= 0.6 * worst;
    }
    cands.sort((a, b) => b.v - a.v);
  }
  return { ...cands[0], bestS };
}

function cpuMove() {
  if (phase !== 'play' || turn !== cpuColor) return;
  const best = chooseMove(cpuColor, LEVELS[game.level]);
  if (!best) { pass(); return; }
  if (game.rule === 'territory' && (best.bestS < -1.5 || (passes > 0 && best.bestS < 2.5))) { pass(); return; }
  placeStone(best.i);
}

const HINT_TEXT = {
  capture: '💡 여기에 두면 상대 돌을 잡을 수 있어요!',
  save: '💡 내 돌이 위험해요! 여기로 도망가요.',
  atari: '💡 여기에 두면 상대 돌을 단수로 만들 수 있어요.',
  good: '💡 여기가 좋아 보여요. 넓은 곳을 먼저 차지해요!',
};

function showHint() {
  if (phase !== 'play' || !isHuman(turn)) return;
  const best = chooseMove(turn, { noise: 0.2, blunder: 0, look: false });
  if (!best) { setMsg('둘 곳이 없어요. "한 수 쉼"을 눌러요.'); return; }
  hintPt = best.i;
  pending = -1;
  setMsg(HINT_TEXT[best.m.reason] + '\n반짝이는 별을 찾아봐요 ⭐');
  draw();
}

const LEVEL_NAMES = { 1: '🌱 기초 · 2~3학년', 2: '🌿 중급 · 4학년', 3: '🌳 고급 · 5~6학년' };

let L = { idx: 0, found: new Set(), wrongPt: -1, solved: false, hintLevel: 0, busy: false, step: 0 };
const ptOf = ([x, y]) => y * N + x;

function enterLesson() {
  if (view === 'lesson') return;
  clearTimeout(cpuTimer);
  savedGame = { N, board, turn, caps, ko, history, last, passes, phase, dead, game };
  view = 'lesson';
  $('tabGame').classList.remove('on');
  $('tabLesson').classList.add('on');
  $('gamePanel').style.display = 'none';
  $('lessonPanel').style.display = '';
  // 아직 안 푼 첫 문제부터
  let first = LESSONS.findIndex((_, k) => !solvedLessons.has(k));
  loadLesson(first < 0 ? 0 : first);
}

function leaveLesson() {
  if (view === 'game') return;
  view = 'game';
  $('tabLesson').classList.remove('on');
  $('tabGame').classList.add('on');
  $('lessonPanel').style.display = 'none';
  $('gamePanel').style.display = '';
  const s = savedGame;
  ({ N, board, turn, caps, ko, history, last, passes, phase, dead, game } = s);
  buildNeighbors();
  hover = pending = hintPt = -1;
  resize();
  updateUI();
  if (game.mode === 'cpu' && phase === 'play' && turn === cpuColor) cpuTimer = setTimeout(cpuMove, 500);
}

function loadLesson(k) {
  L = { idx: k, found: new Set(), wrongPt: -1, solved: false, hintLevel: 0, busy: false, step: 0 };
  const P = LESSONS[k];
  N = 9;
  buildNeighbors();
  board = new Int8Array(N * N);
  for (const p of P.B) board[ptOf(p)] = BLACK;
  for (const p of P.W) board[ptOf(p)] = WHITE;
  turn = BLACK; ko = -1; last = -1; hover = -1;
  $('lessonCh').textContent = `${LEVEL_NAMES[P.lv || 1]} · ${P.ch}  (${k + 1}/${LESSONS.length})`;
  $('lessonTitle').textContent = P.title;
  $('lessonText').textContent = P.text;
  $('lessonMsg').textContent = '';
  $('lessonPrev').disabled = k === 0;
  $('lessonNext').disabled = k === LESSONS.length - 1;
  gridLv = P.lv || 1;
  renderLessonGrid();
  resize();
}

let gridLv = 1; // 문제 목록에서 보고 있는 단계

function renderLessonGrid() {
  // 단계 버튼 (기초 / 중급 / 고급)
  const tabs = $('lvTabs');
  tabs.innerHTML = '';
  for (const lv of [1, 2, 3]) {
    const done = LESSONS.filter((Q, j) => (Q.lv || 1) === lv && solvedLessons.has(j)).length;
    const total = LESSONS.filter(Q => (Q.lv || 1) === lv).length;
    const b = document.createElement('button');
    const [icon, name, grade] = LEVEL_NAMES[lv].split(/ · | /);
    b.innerHTML = `${icon} ${name}<small>${grade}<br>${done === total ? '🏆' : ''}${done}/${total}</small>`;
    b.classList.toggle('on', lv === gridLv);
    b.onclick = () => { gridLv = lv; renderLessonGrid(); };
    tabs.appendChild(b);
  }
  const g = $('lessonGrid');
  g.innerHTML = '';
  LESSONS.forEach((P, k) => {
    if ((P.lv || 1) !== gridLv) return;
    const b = document.createElement('button');
    b.textContent = solvedLessons.has(k) ? `⭐${k + 1}` : k + 1;
    if (solvedLessons.has(k)) b.classList.add('solved');
    if (k === L.idx) b.classList.add('on');
    b.onclick = () => loadLesson(k);
    g.appendChild(b);
  });
}

function lessonMsg(t) { $('lessonMsg').textContent = t; }

// 잠시 뒤 실행: 그 사이 다른 문제로 넘어가거나 대국 화면으로 가면 취소
function lessonLater(fn, ms) {
  const cur = L;
  setTimeout(() => { if (L === cur && view === 'lesson') fn(); }, ms);
}

function lessonSolved() {
  const P = LESSONS[L.idx];
  L.solved = true;
  solvedLessons.add(L.idx);
  saveLessons();
  renderLessonGrid();
  sfx('win');
  const allDone = solvedLessons.size === LESSONS.length;
  lessonMsg(`⭐ ${P.done}` + (L.idx < LESSONS.length - 1 ? '\n"다음 ▶"을 눌러요!' : allDone ? '\n🏆 모든 문제를 다 풀었어요! 이제 대국해 봐요.' : ''));
  draw();
}

function lessonClick(i) {
  const P = LESSONS[L.idx];
  if (L.solved || L.busy) return;
  if (P.type === 'libs') {
    const tg = group(board, ptOf(P.target));
    if (tg.libs.has(i)) {
      if (!L.found.has(i)) { L.found.add(i); playSound(0); }
      if (L.found.size === tg.libs.size) lessonSolved();
      else { lessonMsg(`좋아요! ${L.found.size}개 찾았어요. 더 찾아봐요.`); draw(); }
    } else {
      L.wrongPt = i;
      sfxWrong();
      lessonMsg(board[i] ? '돌이 놓인 곳 말고, 빈 자리를 눌러요.' : '그곳은 백 돌과 선으로 바로 이어져 있지 않아요.');
      draw();
      lessonLater(() => { L.wrongPt = -1; draw(); }, 700);
    }
    return;
  }
  // 착수 문제
  const r = tryPlay(board, i, BLACK, ko);
  if (r.error) {
    sfxWrong();
    lessonMsg(r.error === 'suicide' ? '거기는 숨구멍이 없어서 둘 수 없어요.'
      : r.error === 'ko' ? '패라서 바로 다시 잡을 수 없어요.' : '빈 자리를 눌러요.');
    return;
  }

  if (P.type === 'chase') {
    const t = ptOf(P.target);
    if (!chaseWins(board, t).includes(i)) { lessonWrong(r, i, P); return; }
    board = r.b; last = i;
    playSound(r.captured.length);
    if (!board[t]) { lessonSolved(); return; }
    L.busy = true;
    lessonMsg('좋아요! 백이 어디로 도망갈까요…');
    draw();
    lessonLater(() => {
      const esc = [...group(board, t).libs][0];
      const w = tryPlay(board, esc, WHITE, -1);
      board = w.b; last = esc;
      playSound(w.captured.length);
      L.busy = false;
      lessonMsg(P.chaseMsg || '계속 쫓아가요!');
      draw();
    }, 750);
    return;
  }

  if (P.type === 'seq') {
    const S = P.steps[L.step];
    const ok = S.answers ? S.answers.some(a => ptOf(a) === i) : r.captured.length > 0;
    if (!ok) { lessonWrong(r, i, P); return; }
    board = r.b; ko = r.ko; last = i;
    playSound(r.captured.length);
    if (L.step === P.steps.length - 1) { lessonSolved(); return; }
    L.busy = true;
    lessonMsg('좋아요! 백은 어떻게 할까요…');
    draw();
    lessonLater(() => {
      whiteReply(S.reply, P);
      L.step++;
      L.busy = false;
      lessonMsg(S.next || '이제 어떻게 할까요?');
      draw();
    }, 900);
    return;
  }

  if (P.answers.some(a => ptOf(a) === i)) {
    board = r.b; last = i;
    playSound(r.captured.length);
    lessonSolved();
    return;
  }
  lessonWrong(r, i, P);
}

// 오답: 잠깐 보여 주고 되돌리기
function lessonWrong(r, i, P) {
  const before = board, beforeLast = last;
  board = r.b; last = i;
  playSound(r.captured.length);
  draw();
  const x = i % N, y = (i / N) | 0;
  const w = typeof P.wrong === 'string' ? P.wrong : P.wrong && P.wrong[`${x},${y}`];
  lessonMsg(w || '아쉬워요! 다시 생각해 봐요. 막히면 💡 힌트를 눌러요.');
  L.busy = true;
  lessonLater(() => { board = before; last = beforeLast; L.busy = false; sfxWrong(); draw(); }, 1100);
}

// 연속 문제에서 백이 받는 수
function whiteReply(kind, P) {
  let pt = -1;
  if (kind === 'capture') {            // 방금 둔 흑 돌을 잡음
    const g = group(board, last);
    if (g.libs.size === 1) pt = [...g.libs][0];
  } else if (kind === 'attack') {      // 흑 돌의 숨구멍을 줄임
    pt = [...group(board, ptOf(P.attack)).libs][0];
  }
  if (pt < 0) return;
  const w = tryPlay(board, pt, WHITE, ko);
  if (w.error) return;
  board = w.b; ko = w.ko; last = pt;
  playSound(w.captured.length);
}

// 축·몰기: 계속 단수를 쳐서 끝내 잡을 수 있는 흑의 첫 수들
function chaseWins(b, t, depth = 0) {
  const wins = [];
  if (depth > 16 || !b[t]) return wins;
  for (const m of group(b, t).libs) {
    const r = tryPlay(b, m, BLACK, -1);
    if (r.error) continue;
    if (!r.b[t]) { wins.push(m); continue; }
    const g = group(r.b, t);
    if (g.libs.size !== 1) continue;
    const w = tryPlay(r.b, [...g.libs][0], WHITE, -1);
    if (w.error) continue;
    const libs = group(w.b, t).libs.size;
    if (libs === 1 || (libs === 2 && chaseWins(w.b, t, depth + 1).length)) {
      wins.push(m);
      if (depth > 0) break; // 안쪽에서는 하나만 찾으면 충분
    }
  }
  return wins;
}

function lessonHint() {
  const P = LESSONS[L.idx];
  if (L.solved) return;
  L.hintLevel++;
  if (L.hintLevel >= 2 && P.type !== 'libs') {
    lessonMsg('💡 반짝이는 별 자리에 둬 보세요 ⭐');
  } else if (L.hintLevel >= 2 && P.type === 'libs') {
    lessonMsg('💡 초록 점이 아직 없는 곳을 찾아봐요. 별이 하나 알려 줄게요 ⭐');
  } else {
    lessonMsg('💡 ' + P.hint);
  }
  draw();
}

function lessonHintPoint() {
  const P = LESSONS[L.idx];
  if (L.solved || L.hintLevel < 2 || L.busy) return -1;
  if (P.type === 'move') return ptOf(P.answers[0]);
  if (P.type === 'chase') return chaseWins(board, ptOf(P.target))[0] ?? -1;
  if (P.type === 'seq') {
    const S = P.steps[L.step];
    if (S.answers) return ptOf(S.answers[0]);
    for (let i = 0; i < N * N; i++) { const r = tryPlay(board, i, BLACK, ko); if (!r.error && r.captured.length) return i; }
    return -1;
  }
  const tg = group(board, ptOf(P.target));
  for (const p of tg.libs) if (!L.found.has(p)) return p;
  return -1;
}

// ---------- 그리기 ----------
let size = 600, cell = 60, pad = 60;
const dpr = () => window.devicePixelRatio || 1;

function resize() {
  const box = canvas.parentElement;
  const landscape = matchMedia('(orientation: landscape) and (min-width: 900px)').matches;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const top = box.getBoundingClientRect().top + window.scrollY;
  const w = box.clientWidth;
  let s;
  if (landscape) {
    // 가로: 화면 높이를 꽉 채우는 정사각형 바둑판
    s = Math.min(w, vh - top - 16);
  } else {
    // 세로: 폭을 꽉 채우되, 아래 차례 표시와 버튼이 보일 만큼 남김
    s = Math.min(w, Math.max(320, vh - top - 300));
  }
  size = Math.floor(Math.max(260, Math.min(s, 1100)));
  canvas.width = size * dpr();
  canvas.height = size * dpr();
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  $('side').style.maxHeight = landscape ? size + 'px' : '';
  ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  cell = size / (N - 1 + 1.5);
  pad = cell * 0.75;
  draw();
}

const px = i => pad + (i % N) * cell;
const py = i => pad + ((i / N) | 0) * cell;

function starPoints() {
  if (N === 9) return [[2,2],[6,2],[2,6],[6,6],[4,4]];
  if (N === 13) return [[3,3],[9,3],[3,9],[9,9],[6,6]];
  const a = [3, 9, 15], r = [];
  for (const x of a) for (const y of a) r.push([x, y]);
  return r;
}

function drawStone(x, y, c, alpha = 1) {
  const r = cell * 0.47;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (alpha === 1) {
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = cell * 0.12;
    ctx.shadowOffsetX = cell * 0.04;
    ctx.shadowOffsetY = cell * 0.06;
  }
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  if (c === BLACK) { g.addColorStop(0, '#666'); g.addColorStop(1, '#0a0a0a'); }
  else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9c9c9'); }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function ring(i, color, dashed, radius = 0.5) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(2.5, cell * 0.08);
  if (dashed) ctx.setLineDash([cell * 0.15, cell * 0.1]);
  ctx.beginPath();
  ctx.arc(px(i), py(i), cell * radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function dot(i, color, r = 0.17) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(px(i), py(i), cell * r, 0, Math.PI * 2);
  ctx.fill();
}

function star(i) {
  const cx = px(i), cy = py(i), R = cell * 0.42, r = R * 0.45;
  ctx.save();
  ctx.fillStyle = '#ffd400';
  ctx.strokeStyle = '#b8860b';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r : R;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function draw() {
  if (!board) return;
  // 바둑판
  const wood = ctx.createLinearGradient(0, 0, size, size);
  wood.addColorStop(0, '#e3bd6a');
  wood.addColorStop(1, '#cf9f45');
  ctx.fillStyle = wood;
  ctx.fillRect(0, 0, size, size);

  ctx.strokeStyle = '#3b2a14';
  ctx.lineWidth = Math.max(1, size / 600);
  ctx.beginPath();
  for (let k = 0; k < N; k++) {
    const p = pad + k * cell;
    ctx.moveTo(pad, p); ctx.lineTo(pad + (N - 1) * cell, p);
    ctx.moveTo(p, pad); ctx.lineTo(p, pad + (N - 1) * cell);
  }
  ctx.stroke();
  ctx.lineWidth = Math.max(2, size / 300);
  ctx.strokeRect(pad, pad, (N - 1) * cell, (N - 1) * cell);

  ctx.fillStyle = '#3b2a14';
  for (const [x, y] of starPoints()) {
    ctx.beginPath();
    ctx.arc(pad + x * cell, pad + y * cell, Math.max(2.5, cell * 0.1), 0, Math.PI * 2);
    ctx.fill();
  }

  // 계가 표시
  const ev = view === 'game' && (phase === 'score' || phase === 'over') && game.rule === 'territory' ? evaluate() : null;

  for (let i = 0; i < N * N; i++) {
    if (!board[i]) continue;
    const isDead = ev && dead.has(i);
    drawStone(px(i), py(i), board[i], isDead ? 0.4 : 1);
    if (isDead) {
      const s = cell * 0.2;
      ctx.strokeStyle = '#d33';
      ctx.lineWidth = Math.max(2, cell * 0.07);
      ctx.beginPath();
      ctx.moveTo(px(i) - s, py(i) - s); ctx.lineTo(px(i) + s, py(i) + s);
      ctx.moveTo(px(i) + s, py(i) - s); ctx.lineTo(px(i) - s, py(i) + s);
      ctx.stroke();
    }
  }

  if (ev) {
    for (let i = 0; i < N * N; i++) {
      if (!ev.owner[i]) continue;
      const s = cell * 0.28;
      ctx.fillStyle = ev.owner[i] === BLACK ? '#111' : '#fff';
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      ctx.fillRect(px(i) - s / 2, py(i) - s / 2, s, s);
      ctx.strokeRect(px(i) - s / 2, py(i) - s / 2, s, s);
    }
  }

  // 마지막 수 표시
  if (last >= 0 && board[last]) {
    ctx.strokeStyle = board[last] === BLACK ? '#fff' : '#000';
    ctx.lineWidth = Math.max(2, cell * 0.07);
    ctx.beginPath();
    ctx.arc(px(last), py(last), cell * 0.2, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (view === 'lesson') { drawLessonOverlay(); return; }

  // 배움 도우미: 단수인 돌에 빨간 동그라미
  if (settings.helper && phase === 'play') {
    for (const c of [BLACK, WHITE]) for (const g of ataris(board, c)) for (const s of g.stones) ring(s, '#e53935', false, 0.52);
  }

  // 힌트 별
  if (phase === 'play' && hintPt >= 0 && board[hintPt] === EMPTY) star(hintPt);

  // '두 번 눌러 두기' 첫 번째 누른 자리 + 숨구멍 미리보기
  if (phase === 'play' && pending >= 0 && board[pending] === EMPTY) {
    const r = tryPlay(board, pending, turn, ko);
    drawStone(px(pending), py(pending), turn, 0.6);
    ring(pending, '#c0392b', true);
    if (settings.helper && !r.error) for (const l of r.group.libs) dot(l, 'rgba(46,139,87,0.85)');
  }
  // 마우스 위치 미리보기 (마우스를 쓸 때만)
  else if (phase === 'play' && hover >= 0 && board[hover] === EMPTY && isHuman(turn)) {
    drawStone(px(hover), py(hover), turn, 0.4);
  }
}

function drawLessonOverlay() {
  const P = LESSONS[L.idx];
  if (P.type === 'libs') {
    for (const s of group(board, ptOf(P.target)).stones) ring(s, '#1e88e5', true, 0.55);
    for (const p of L.found) dot(p, 'rgba(46,139,87,0.9)', 0.22);
  } else if (P.target && !L.solved && P.type === 'move') {
    for (const s of group(board, ptOf(P.target)).stones) ring(s, '#e53935', false, 0.52);
  }
  if (L.wrongPt >= 0) {
    const s = cell * 0.2, i = L.wrongPt;
    ctx.strokeStyle = '#e53935';
    ctx.lineWidth = Math.max(3, cell * 0.09);
    ctx.beginPath();
    ctx.moveTo(px(i) - s, py(i) - s); ctx.lineTo(px(i) + s, py(i) + s);
    ctx.moveTo(px(i) + s, py(i) - s); ctx.lineTo(px(i) - s, py(i) + s);
    ctx.stroke();
  }
  const h = lessonHintPoint();
  if (h >= 0) star(h);
  if (hover >= 0 && board[hover] === EMPTY && P.type !== 'libs' && !L.solved) drawStone(px(hover), py(hover), BLACK, 0.4);
}

function pointFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (size / rect.width);
  const y = (e.clientY - rect.top) * (size / rect.height);
  const cx = Math.round((x - pad) / cell), cy = Math.round((y - pad) / cell);
  if (cx < 0 || cy < 0 || cx >= N || cy >= N) return -1;
  if (Math.hypot(x - (pad + cx * cell), y - (pad + cy * cell)) > cell * 0.55) return -1;
  return cy * N + cx;
}

canvas.addEventListener('click', e => {
  const i = pointFromEvent(e);
  if (i < 0) return;
  getAudio(); // 아이패드에서 첫 터치 때 소리 켜기
  if (view === 'lesson') { lessonClick(i); return; }
  if (phase === 'score') { toggleDead(i); return; }
  if (phase !== 'play' || !isHuman(turn)) return;
  if (settings.confirm && pending !== i) {
    if (board[i] !== EMPTY) return;
    pending = i;
    const r = tryPlay(board, i, turn, ko);
    let m = '같은 곳을 한 번 더 누르면 돌이 놓여요.';
    if (settings.helper && !r.error) {
      if (r.captured.length) m = `여기에 두면 돌 ${r.captured.length}개를 잡아요!\n` + m;
      else if (r.libs === 1) m = `⚠️ 여기에 두면 숨구멍이 1개뿐이라 잡힐 수 있어요!\n` + m;
      else m = `초록 점은 숨구멍이에요 (${r.libs}개).\n` + m;
    }
    setMsg(m);
    draw();
    return;
  }
  pending = -1;
  placeStone(i);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const i = pointFromEvent(e);
  if (i !== hover) { hover = i; draw(); }
});
canvas.addEventListener('mouseleave', () => { hover = -1; draw(); });

// ---------- 소리 · 진동 ----------
let audioCtx = null;
function getAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
  return audioCtx;
}

// 돌이 바둑판에 "딱" 부딪히는 소리: 짧은 타격음 + 나무판 울림
function stoneClick(ac, t, vol) {
  const len = Math.floor(ac.sampleRate * 0.025);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 4);
  const noise = ac.createBufferSource();
  noise.buffer = buf;
  const hp = ac.createBiquadFilter();
  hp.type = 'bandpass';
  hp.frequency.value = 3200 + Math.random() * 600;
  hp.Q.value = 1.2;
  const ng = ac.createGain();
  ng.gain.value = 1.4 * vol;
  noise.connect(hp).connect(ng).connect(ac.destination);
  noise.start(t);

  for (const [f, v, dur] of [[190, 0.9, 0.12], [420, 0.45, 0.07], [1250, 0.25, 0.04]]) {
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f * (1 + Math.random() * 0.04), t);
    o.frequency.exponentialRampToValueAtTime(f * 0.85, t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v * vol, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
}

// 따낸 돌을 집어 드는 "달그락" 소리
function stoneClatter(ac, t, count) {
  const n = Math.min(2 + count, 6);
  for (let k = 0; k < n; k++) {
    const tt = t + 0.12 + k * (0.045 + Math.random() * 0.04);
    const len = Math.floor(ac.sampleRate * 0.012);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let j = 0; j < len; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / len, 3);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 4500 + Math.random() * 2000;
    bp.Q.value = 3;
    const g = ac.createGain();
    g.gain.value = 0.5 + Math.random() * 0.3;
    src.connect(bp).connect(g).connect(ac.destination);
    src.start(tt);
  }
}

function tone(ac, f, t, dur, vol = 0.25, type = 'sine') {
  const o = ac.createOscillator();
  o.type = type;
  o.frequency.value = f;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}

// 정답·승리 효과음 (도-미-솔-도)
function sfx(kind) {
  if (!settings.sound) return;
  try {
    const ac = getAudio(), t = ac.currentTime + 0.25;
    if (kind === 'win') [523, 659, 784, 1047].forEach((f, k) => tone(ac, f, t + k * 0.11, 0.3, 0.22, 'triangle'));
    else [392, 330, 262].forEach((f, k) => tone(ac, f, t + k * 0.16, 0.35, 0.18, 'triangle'));
  } catch (e) {}
}

function sfxWrong() {
  if (settings.sound) {
    try { const ac = getAudio(); tone(ac, 200, ac.currentTime, 0.18, 0.2, 'triangle'); } catch (e) {}
  }
  if (settings.vibe && navigator.vibrate) navigator.vibrate(60);
}

function playSound(captured) {
  if (settings.sound) {
    try {
      const ac = getAudio();
      const t = ac.currentTime + 0.005;
      stoneClick(ac, t, 1);
      if (captured > 0) stoneClatter(ac, t, captured);
    } catch (e) {}
  }
  if (settings.vibe && navigator.vibrate) {
    navigator.vibrate(captured > 0 ? [35, 60, 20, 40, 20] : 30);
  }
}

// ---------- 화면 ----------
function setMsg(t) { $('msg').textContent = t; }

function updateUI() {
  const t = $('turn');
  if (phase === 'play') {
    const who = game.mode === 'cpu' ? (turn === cpuColor ? ' (컴퓨터가 생각 중…)' : ' (내 차례)') : '';
    t.innerHTML = `<div class="stone-icon ${turn === BLACK ? 'b' : 'w'}"></div><span>${NAME[turn]} 차례${who}</span>`;
  } else if (phase === 'score') {
    t.innerHTML = '<span>집 세는 중</span>';
  } else {
    t.innerHTML = '<span>대국 끝</span>';
  }
  const lv = game.mode === 'cpu' ? ` · ${LEVELS[game.level].name}` : ' · 친구와';
  $('goal').textContent = (game.rule === 'capture' ? `🎯 돌 ${game.target}개를 먼저 잡으면 승리!` : '🏠 집이 많으면 승리!') + lv;
  $('capB').textContent = caps[1];
  $('capW').textContent = caps[2];
  const cpuThinking = game.mode === 'cpu' && turn === cpuColor && phase === 'play';
  $('playBtns').style.display = phase === 'score' ? 'none' : '';
  $('scoreBtns').style.display = phase === 'score' ? '' : 'none';
  $('passBtn').disabled = phase !== 'play' || cpuThinking;
  $('resignBtn').disabled = phase !== 'play' || cpuThinking;
  $('hintBtn').disabled = phase !== 'play' || cpuThinking;
  $('undoBtn').disabled = !(history.length || resigned) || cpuThinking;
}

function showModal(emoji, title, body) {
  $('resultEmoji').textContent = emoji;
  $('resultTitle').textContent = title;
  $('resultBody').innerHTML = body;
  $('modalBg').classList.add('show');
}
function closeModal() { $('modalBg').classList.remove('show'); }

// 새 대국 설정 창
function segValue(id, v) {
  document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
}
let draft = {}; // 설정 창에서 고르는 중인 값 ('시작!'을 눌러야 반영)
function refreshSetup() {
  segValue('ruleSeg', draft.rule);
  segValue('targetSeg', draft.target);
  segValue('sizeSeg', draft.size);
  segValue('modeSeg', draft.mode);
  segValue('levelSeg', draft.level);
  $('ruleDesc').textContent = RULE_DESC[draft.rule];
  $('targetBox').style.display = draft.rule === 'capture' ? '' : 'none';
  $('levelBox').style.display = draft.mode === 'cpu' ? '' : 'none';
  $('levelDesc').textContent = `${LEVELS[draft.level].name} — ${LEVELS[draft.level].desc}`;
}
function bindSeg(id, key, num) {
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    draft[key] = num ? +b.dataset.v : b.dataset.v;
    refreshSetup();
  });
}
bindSeg('ruleSeg', 'rule');
bindSeg('targetSeg', 'target', true);
bindSeg('sizeSeg', 'size', true);
bindSeg('modeSeg', 'mode');
bindSeg('levelSeg', 'level', true);

function openSetup() {
  const { rule, target, size, mode, level } = settings;
  draft = { rule, target, size, mode, level };
  refreshSetup(); closeModal(); $('setupBg').classList.add('show'); }
$('setupCancel').onclick = () => $('setupBg').classList.remove('show');
$('setupStart').onclick = () => {
  $('setupBg').classList.remove('show');
  Object.assign(settings, draft);
  saveSettings();
  getAudio();
  newGame();
};

function updateFx() {
  const set = (id, on, onText, offText) => {
    $(id).textContent = on ? onText : offText;
    $(id).classList.toggle('on', on);
  };
  set('helperBtn', settings.helper, '🧑‍🏫 도우미 켜짐', '도우미 꺼짐');
  set('confirmBtn', settings.confirm, '👆👆 두 번 눌러 두기', '👆 한 번 눌러 두기');
  set('soundBtn', settings.sound, '🔊 소리 켜짐', '🔇 소리 꺼짐');
  set('vibeBtn', settings.vibe, '📳 진동 켜짐', '진동 꺼짐');
  if (!navigator.vibrate) $('vibeBtn').style.display = 'none'; // 아이패드·아이폰은 진동 미지원
}
$('helperBtn').onclick = () => { settings.helper = !settings.helper; saveSettings(); updateFx(); draw(); };
$('confirmBtn').onclick = () => { settings.confirm = !settings.confirm; pending = -1; saveSettings(); updateFx(); draw(); };
$('soundBtn').onclick = () => { settings.sound = !settings.sound; saveSettings(); updateFx(); if (settings.sound) playSound(0); };
$('vibeBtn').onclick = () => { settings.vibe = !settings.vibe; saveSettings(); updateFx(); if (settings.vibe && navigator.vibrate) navigator.vibrate(30); };

$('tabGame').onclick = leaveLesson;
$('tabLesson').onclick = enterLesson;
$('newBtn').onclick = openSetup;
$('modalNew').onclick = openSetup;
$('hintBtn').onclick = showHint;
$('passBtn').onclick = pass;
$('undoBtn').onclick = undo;
$('resignBtn').onclick = resign;
$('countBtn').onclick = finishCount;
$('resumeBtn').onclick = resumePlay;
$('closeModal').onclick = closeModal;
$('lessonPrev').onclick = () => L.idx > 0 && loadLesson(L.idx - 1);
$('lessonNext').onclick = () => L.idx < LESSONS.length - 1 && loadLesson(L.idx + 1);
$('lessonRetry').onclick = () => loadLesson(L.idx);
$('lessonHint').onclick = lessonHint;

updateFx();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (document.fonts) document.fonts.ready.then(resize);

newGame();
</script>
